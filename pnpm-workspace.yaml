# Created by gg_localize_refs. The overrides section redirects
# the dependencies of package.json to the sibling checkouts of
# this workspace without touching their published constraints.
# change-refs-to-pub-dev removes the section again.
# Supply-chain guard: a freshly published third-party release has to age
# before we install it, so a compromised package has a window to be found
# and pulled. The value is in minutes.
minimumReleaseAge: 1440

# Our own packages are published and consumed within the same workspace:
# a release has to be installable the moment it is out, so the age above
# does not apply to them.
minimumReleaseAgeExclude:
  - '@tssuite/*'
  - '@ggdna/*'
  - '@carat-ds/*'
overrides:
  "@ggdna\/dna-translate": link:../dna_translate
  "@ggdna\/dna-guides": link:../dna_guides
  "@ggdna\/dna-helix": link:../dna_helix
  "@ggdna\/dna-readme": link:../dna_readme
  "@tssuite\/helix-js": link:../helix-js
  "@ggdna\/dna-index": link:../dna_index
  "@ggdna\/dna-blog": link:../dna_blog
  "@ggdna\/dna-install": link:../dna_install
  "@ggdna\/dna-vscode": link:../dna_vscode
  "@ggdna\/dna-clean-code": link:../dna_clean_code
  "@ggdna\/dna-gg": link:../dna_gg
  "@ggdna\/dna-scripts": link:../dna_scripts
  "@ggdna\/dna-ggdna": link:../dna_ggdna
